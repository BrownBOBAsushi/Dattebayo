<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ff5c19">
  <meta name="description" content="Dattebayo. Something new is taking shape.">
  <title>Dattebayo — Coming soon</title>
  <style>
    *{box-sizing:border-box}html{font-size:16px}body{margin:0;background:#ff5c19;color:#191915;font-family:Arial,Helvetica,sans-serif}main{min-height:100svh;display:flex;flex-direction:column;padding:clamp(24px,4vw,64px);overflow:hidden}header,footer{display:flex;justify-content:space-between;gap:24px;align-items:center;font-size:.875rem}header{font-weight:700;letter-spacing:.08em;text-transform:uppercase}.mark{border:2px solid currentColor;border-radius:50%;width:42px;height:42px;display:grid;place-items:center;font-size:1.25rem}.center{flex:1;display:flex;flex-direction:column;justify-content:center;padding:80px 0}.eyebrow{font-size:.875rem;letter-spacing:.12em;text-transform:uppercase;margin:0 0 28px}h1{font-size:clamp(3.6rem,13.4vw,14rem);font-weight:900;letter-spacing:-.075em;line-height:1;margin:0 0 36px;max-width:100%}.message{font-size:clamp(1.4rem,3vw,2.5rem);letter-spacing:-.04em;line-height:1.2;margin:0;max-width:19ch}footer{padding-top:24px;border-top:1px solid #19191566;line-height:1.5}.soon{display:inline-block;padding:8px 14px;border:1px solid currentColor;border-radius:30px}::selection{background:#191915;color:#ff5c19}@media(max-width:480px){h1{font-size:15vw}.center{padding:64px 0}footer{align-items:flex-start;flex-direction:column;gap:16px}}@media(prefers-reduced-motion:no-preference){.center{animation:arrive .7s ease-out}@keyframes arrive{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}}
  </style>
</head>
<body>
  <main>
    <header><span class="mark" aria-hidden="true">D.</span><span>Just getting started</span></header>
    <section class="center" aria-labelledby="title">
      <p class="eyebrow">A little ambition. A lot of possibility.</p>
      <h1 id="title">Dattebayo.</h1>
      <p class="message">Something new<br>is taking shape.</p>
    </section>
    <footer><span>Good things take a little building.</span><span class="soon">Coming soon</span></footer>
  </main>
</body>
</html>
